<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Vault Distributed Storage Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    
    /* ============================================================
       VAULT DISTINCTIVE PALETTE — PRODUCTION GRADE
       ============================================================ */
    :root {
      --bg: #0a0e27;
      --surface: #0f1629;
      --border: rgba(255, 255, 255, 0.05);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --cyan: #00d9ff;
      --purple: #7b2cbf;
      --emerald: #10b981;
      
      --primary: var(--cyan);
      --primary-hover: #00b8d9;
      --primary-glow: rgba(0, 217, 255, 0.4);
      --secondary: var(--purple);
      --accent: var(--cyan);
      --success: var(--emerald);
      --warning: #F59E0B;
      --danger: #EF4444;

      --bg-dark: var(--bg);
      --surface-color: var(--surface);
      --border-color: var(--border);
      --text-primary: var(--text-main);
      --text-secondary: var(--text-muted);
      --text-tertiary: #64748b;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.5);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.5);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      
      /* Base scale */
      --spacing-1: 4px;
      --spacing-2: 8px;
      --spacing-3: 12px;
      --spacing-4: 16px;
      --spacing-6: 24px;
      --spacing-8: 32px;
      --spacing-12: 48px;
      --spacing-16: 64px;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      line-height: 1.5;
    }
    
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }


    /* Ambient background */
    .ambient-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: -1;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.25;
    }
    .orb-1 { width: 500px; height: 500px; background: #FF6B35; top: -100px; left: -100px; }
    .orb-2 { width: 500px; height: 500px; background: #8B5CF6; bottom: -100px; right: -100px; }

    /* Card */
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      backdrop-filter: blur(24px);
      position: relative;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      background: var(--gradient-brand);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--gradient-brand);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-glow);
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid var(--surface-border);
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 9px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: var(--surface);
      color: #FF6B35;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-family: var(--font);
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: var(--gradient-brand);
      color: #FFFFFF;
      box-shadow: var(--shadow-glow);
      margin-top: 10px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -6px rgba(255, 107, 53, 0.5);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--surface-border);
    }

    /* Quick Demo Logins */
    .quick-logins {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .quick-btn {
      width: 100%;
      padding: 11px 14px;
      border-radius: 9px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-btn:hover {
      border-color: var(--primary);
      background: rgba(255, 107, 53, 0.1);
      transform: translateX(4px);
    }
    .quick-btn-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(255, 107, 53, 0.15);
      color: #FF6B35;
      font-weight: 700;
    }

    .cloud-status {
      margin-top: 22px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      font-size: 12px;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-home:hover { color: #FF6B35; }
  
    :focus-visible {
      outline: 2px solid var(--primary, #FF6B35) !important;
      outline-offset: 3px !important;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .skip-to-content {
      position: fixed; top: -60px; left: 16px; background: var(--primary, #FF6B35);
      color: #FFFFFF; padding: 10px 18px; z-index: 99999; font-weight: 800;
      border-radius: 8px; text-decoration: none; transition: top 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5); font-size: 13px;
    }
    .skip-to-content:focus { top: 16px; }

  </style>
</head>
<body>
  <a href="#main-content" class="skip-to-content">Skip to Main Content</a>

  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-logo">🔐</div>
      <h1 class="brand-title">Vault Storage</h1>
      <p class="brand-subtitle">Distributed Object Storage & Health Telemetry</p>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tabSignIn" onclick="switchTab('signin')">Sign In</div>
      <div class="auth-tab" id="tabSignUp" onclick="switchTab('signup')">Create Account</div>
    </div>

    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="form-group" id="nameGroup" style="display: none;">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" id="nameInput" placeholder="Dr. Alice Chen" />
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="emailInput" placeholder="admin@vault.io" required value="admin@vault.io" />
      </div>

      <div class="form-group">
        <label class="form-label">Access Token / Password</label>
        <input type="password" class="form-input" id="passwordInput" placeholder="••••••••••••" required value="vault-cluster-2026" />
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn" aria-label="Primary Action">
        <span>🚀 Sign In to Cluster</span>
      </button>
    </form>

    <div class="divider">OR CHOOSE 1-CLICK DEMO PROFILE</div>

    <div class="quick-logins">
      <button class="quick-btn" onclick="quickLogin('Cluster Architect', 'admin@vault.io', 'Storage Architect')" aria-label="button">
        <span>👑 Storage Architect</span>
        <span class="quick-btn-badge">Full Access</span>
      </button>
      <button class="quick-btn" onclick="quickLogin('Chaos Engineer', 'chaos@vault.io', 'Chaos Specialist')" aria-label="button">
        <span>⚡ Chaos Engineer</span>
        <span class="quick-btn-badge">Lab Access</span>
      </button>
      <button class="quick-btn" onclick="quickLogin('Dev Operator', 'demo@vault.io', 'Read / Write')" aria-label="button">
        <span>👨‍💻 Developer Operator</span>
        <span class="quick-btn-badge">Standard</span>
      </button>
    </div>

    <div class="cloud-status">
      <span>⚡</span> Connected to Supabase Project: <strong>csrhmocmponregwceknr</strong>
    </div>

    <a href="index.html" class="back-home">← Return to Homepage</a>
  </div>

  <script src="vault-storage.js"></script>
  <script>
    let currentMode = 'signin';

    function switchTab(mode) {
      currentMode = mode;
      document.getElementById('tabSignIn').classList.toggle('active', mode === 'signin');
      document.getElementById('tabSignUp').classList.toggle('active', mode === 'signup');
      document.getElementById('nameGroup').style.display = mode === 'signup' ? 'block' : 'none';
      document.getElementById('submitBtn').innerHTML = mode === 'signin' ? '<span>🚀 Sign In to Cluster</span>' : '<span>✨ Create Operator Account</span>';
    }

    function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      const name = currentMode === 'signup' ? document.getElementById('nameInput').value : email.split('@')[0];
      loginUser(name || 'Cluster Operator', email, 'Storage Operator');
    }

    function quickLogin(name, email, role) {
      loginUser(name, email, role);
    }

    function loginUser(name, email, role) {
      const user = {
        name: name,
        email: email,
        role: role,
        avatar: name.charAt(0),
        loggedInAt: new Date().toISOString()
      };
      localStorage.setItem('vault_user', JSON.stringify(user));
      
      const btn = document.getElementById('submitBtn');
      btn.innerHTML = '<span>✅ Authenticated! Initializing Storage...</span>';
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    }
  </script>
</body>
</html>
